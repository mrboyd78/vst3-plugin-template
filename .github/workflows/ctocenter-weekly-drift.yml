name: CTO Command Center - Weekly Drift Check

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  drift-detection:
    name: Detect Documentation Drift
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run drift detection
        id: drift
        run: |
          npm run ctocenter:scan || echo "drift_detected=true" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Read signals file
        id: signals
        if: always()
        run: |
          SIGNALS=$(cat .ctocenter/state/signals.json)
          echo "signals<<EOF" >> $GITHUB_OUTPUT
          echo "$SIGNALS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create drift issue
        if: steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const signals = JSON.parse(fs.readFileSync('.ctocenter/state/signals.json', 'utf8'));
            
            let body = '## 📊 Weekly Documentation Drift Report\n\n';
            body += `**Report Date:** ${new Date().toISOString().split('T')[0]}\n\n`;
            body += '⚠️ **Drift detected** - Action required\n\n';
            
            body += '---\n\n';
            
            if (signals.signals.documentation.issues.length > 0) {
              body += '### 📚 Documentation Issues\n\n';
              signals.signals.documentation.issues.forEach(issue => {
                body += `- [ ] ${issue}\n`;
              });
              body += '\n';
            }
            
            if (signals.signals.api_changes.changes.length > 0) {
              body += '### 🔧 API Changes\n\n';
              signals.signals.api_changes.changes.forEach(change => {
                body += `- [ ] ${change}\n`;
              });
              body += '\n';
            }
            
            if (signals.signals.dependencies.outdated.length > 0) {
              body += '### 📦 Dependencies\n\n';
              signals.signals.dependencies.outdated.forEach(dep => {
                body += `- [ ] ${dep}\n`;
              });
              body += '\n';
            }
            
            if (signals.signals.governance.missing_adrs.length > 0 || 
                signals.signals.governance.missing_runbooks.length > 0) {
              body += '### 📋 Governance\n\n';
              
              if (signals.signals.governance.missing_adrs.length > 0) {
                body += '**ADRs:**\n';
                signals.signals.governance.missing_adrs.forEach(adr => {
                  body += `- [ ] ${adr}\n`;
                });
              }
              
              if (signals.signals.governance.missing_runbooks.length > 0) {
                body += '**Runbooks:**\n';
                signals.signals.governance.missing_runbooks.forEach(rb => {
                  body += `- [ ] ${rb}\n`;
                });
              }
              body += '\n';
            }
            
            body += '---\n\n';
            body += '### 💡 Recommendations\n\n';
            
            if (signals.recommendations.length > 0) {
              signals.recommendations.forEach(rec => {
                body += `**[${rec.priority.toUpperCase()}]** ${rec.message}\n`;
                body += `→ ${rec.action}\n\n`;
              });
            }
            
            body += '---\n\n';
            body += '### Actions\n\n';
            body += '- [ ] Review all issues above\n';
            body += '- [ ] Update documentation to address drift\n';
            body += '- [ ] Run `npm run ctocenter:scan` to verify fixes\n';
            body += '- [ ] Close this issue when all items are resolved\n\n';
            
            body += '**Auto-generated by CTO Command Center**\n';
            
            // Check if there's already an open drift issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift-alert'
            });
            
            if (issues.data.length > 0) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `## Updated Report (${new Date().toISOString().split('T')[0]})\n\n${body}`
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `📊 Documentation Drift Alert - ${new Date().toISOString().split('T')[0]}`,
                body: body,
                labels: ['drift-alert', 'documentation', 'automated']
              });
            }
      
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: weekly-drift-report
          path: .ctocenter/state/signals.json
          retention-days: 90
